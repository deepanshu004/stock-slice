openapi: 3.1.0
info:
  title: Stock Slice API
  version: 1.0.0
  description: In-memory demo wallet, portfolio allocation, and owned-stock trading. Demo payments and trades complete immediately; no real cards are charged or trades routed.
servers:
  - url: http://localhost:4000
paths:
  /api/health:
    get:
      summary: Health and process-local order count
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  storage: { const: in-memory }
                  orders: { type: integer }
  /api/config:
    get:
      summary: Service calculation configuration
      responses:
        '200':
          description: Share precision, default price, and currency
          content:
            application/json:
              schema:
                type: object
                required: [sharePrecision, defaultPrice, currency]
                properties:
                  sharePrecision: { type: integer, minimum: 0, maximum: 10 }
                  defaultPrice: { const: 100 }
                  currency: { const: USD }
  /api/wallet:
    get:
      summary: Get the current demo wallet balance
      responses:
        '200':
          description: Process-local wallet, initially zero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletResponse' }
  /api/wallet/top-ups:
    post:
      summary: Add demo funds using the simulated card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, paymentMethod]
              properties:
                amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
                paymentMethod: { const: demo-card }
      responses:
        '201':
          description: Updated wallet balance; no real payment is processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '429': { description: Demo funding rate limit exceeded }
  /api/positions:
    get:
      summary: List currently owned stocks and remaining quantities
      responses:
        '200':
          description: Positions bought in this process, excluding fully sold stocks
          content:
            application/json:
              schema:
                type: object
                required: [data, count]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Position' } }
                  count: { type: integer }
  /api/portfolios:
    get:
      summary: List portfolios saved in this process
      responses:
        '200':
          description: Portfolio list
          content:
            application/json:
              schema:
                type: object
                required: [data, count]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Portfolio' } }
                  count: { type: integer }
    post:
      summary: Save a reusable model portfolio in memory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioInput' }
      responses:
        '201':
          description: Portfolio saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/orders:
    get:
      summary: List orders created in this process, newest first
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: object
                required: [data, count]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  count: { type: integer }
    post:
      summary: Place a simulated buy or sell and update the wallet and positions
      description: Buys debit the full requested amount and add allocated shares. Sells take owned quantities and credit proceeds at each position's stored reference price. All changes complete together; rejected orders leave balances, positions, and history unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Completed simulated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '429': { description: Order creation rate limit exceeded }
  /api/orders/{id}:
    get:
      summary: Get an order from process-local history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { description: Order not found }
components:
  responses:
    AccountConflict:
      description: Insufficient wallet funds, unowned stock, an insufficient owned quantity, or account value/quantity limits
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { enum: [INSUFFICIENT_FUNDS, POSITION_NOT_FOUND, INSUFFICIENT_QUANTITY, WALLET_LIMIT_EXCEEDED, POSITION_LIMIT_EXCEEDED] }
                  message: { type: string }
    ValidationError:
      description: Invalid JSON request data
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { const: VALIDATION_ERROR }
                  message: { type: string }
                  details: { type: array, items: { type: object } }
  schemas:
    Wallet:
      type: object
      required: [balance, currency, paymentMode]
      properties:
        balance: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { const: USD }
        paymentMode: { const: demo }
    WalletResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Wallet' }
    Position:
      type: object
      required: [symbol, quantity, price, marketValue]
      properties:
        symbol: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        price: { type: number, exclusiveMinimum: 0 }
        marketValue: { type: number, minimum: 0 }
      description: Price is the last simulated purchase price for this symbol; marketValue is quantity times that price, rounded to cents.
    Holding:
      type: object
      additionalProperties: false
      required: [symbol, allocationPercent]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Za-z0-9.-]+$' }
        allocationPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        marketPrice: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
    PortfolioInput:
      type: object
      additionalProperties: false
      required: [holdings]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        holdings:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Holding' }
      description: Symbols are unique and allocations must total 100%.
    Portfolio:
      allOf:
        - $ref: '#/components/schemas/PortfolioInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    CreateOrderRequest:
      oneOf:
        - $ref: '#/components/schemas/BuyOrderRequest'
        - $ref: '#/components/schemas/SellOrderRequest'
      discriminator:
        propertyName: type
        mapping:
          BUY: '#/components/schemas/BuyOrderRequest'
          SELL: '#/components/schemas/SellOrderRequest'
    BuyOrderRequest:
      type: object
      additionalProperties: false
      required: [type, amount, portfolio]
      properties:
        type: { const: BUY }
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
        portfolio: { $ref: '#/components/schemas/PortfolioInput' }
    SellOrderRequest:
      type: object
      additionalProperties: false
      required: [type, positions]
      properties:
        type: { const: SELL }
        positions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [symbol, quantity]
            properties:
              symbol: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Za-z0-9.-]+$' }
              quantity: { type: number, exclusiveMinimum: 0 }
      description: Symbols must be unique after normalization. Quantities must respect the configured share precision and cannot exceed owned quantities. Prices and proceeds are determined by the API.
    Allocation:
      type: object
      required: [symbol, allocationPercent, price, amount, shares, estimatedTradeValue, unallocatedAmount]
      properties:
        symbol: { type: string }
        allocationPercent: { type: number }
        price: { type: number }
        amount: { type: number }
        shares: { type: number }
        estimatedTradeValue: { type: number }
        unallocatedAmount: { type: number }
    Order:
      type: object
      required: [id, type, status, amount, portfolioName, allocations, executionAt, executionTimezone, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [BUY, SELL] }
        status: { const: COMPLETED }
        amount: { type: number }
        portfolioName: { type: string }
        allocations: { type: array, items: { $ref: '#/components/schemas/Allocation' } }
        executionAt: { type: string, format: date-time }
        executionTimezone: { const: America/New_York }
        createdAt: { type: string, format: date-time }
